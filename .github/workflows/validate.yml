name: Field Labs Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate Labs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run transaction reliability tests
        run: python -m unittest discover -s labs/01-transaction-reliability/tests -v

      - name: Run AI workflow boundary tests
        run: python -m unittest discover -s labs/02-ai-workflow-boundaries/tests -v

      - name: Run email delivery evidence tests
        run: PYTHONPATH=labs/03-email-delivery-verification python -m unittest discover -s labs/03-email-delivery-verification/tests -v

      - name: Run web session reliability tests
        run: PYTHONPATH=labs/04-web-session-reliability python -m unittest discover -s labs/04-web-session-reliability/tests -v

      - name: Run document annotation tests
        run: PYTHONPATH=labs/05-document-annotation python -m unittest discover -s labs/05-document-annotation/tests -v

      - name: Run verified document pipeline tests
        run: PYTHONPATH=labs/06-verified-document-pipeline python -m unittest discover -s labs/06-verified-document-pipeline/tests -v

      - name: Run offline event check-in tests
        run: PYTHONPATH=labs/07-offline-event-check-in python -m unittest discover -s labs/07-offline-event-check-in/tests -v

      - name: Run AI product discovery tests
        run: PYTHONPATH=labs/08-ai-product-discovery python -m unittest discover -s labs/08-ai-product-discovery/tests -v

      - name: Run bounded API retry tests
        run: PYTHONPATH=labs/09-bounded-api-retries python -m unittest discover -s labs/09-bounded-api-retries/tests -v

      - name: Run circuit breaker recovery tests
        run: PYTHONPATH=labs/10-circuit-breaker-recovery python -m unittest discover -s labs/10-circuit-breaker-recovery/tests -v

      - name: Run bulkhead isolation tests
        run: PYTHONPATH=labs/11-bulkhead-isolation python -m unittest discover -s labs/11-bulkhead-isolation/tests -v

      - name: Run token bucket rate limiting tests
        run: PYTHONPATH=labs/12-token-bucket-rate-limiting python -m unittest discover -s labs/12-token-bucket-rate-limiting/tests -v

      - name: Run request deadline budgeting tests
        run: PYTHONPATH=labs/13-request-deadline-budgeting python -m unittest discover -s labs/13-request-deadline-budgeting/tests -v

      - name: Run cooperative cancellation tests
        run: PYTHONPATH=labs/14-cooperative-cancellation python -m unittest discover -s labs/14-cooperative-cancellation/tests -v

      - name: Run load shedding tests
        run: PYTHONPATH=labs/15-load-shedding python -m unittest discover -s labs/15-load-shedding/tests -v

      - name: Run graceful degradation tests
        run: PYTHONPATH=labs/16-graceful-degradation python -m unittest discover -s labs/16-graceful-degradation/tests -v

      - name: Run request coalescing tests
        run: PYTHONPATH=labs/17-request-coalescing python -m unittest discover -s labs/17-request-coalescing/tests -v

      - name: Run stale cache fallback tests
        run: PYTHONPATH=labs/18-stale-cache-fallback python -m unittest discover -s labs/18-stale-cache-fallback/tests -v

      - name: Run hedged request admission tests
        run: PYTHONPATH=labs/19-hedged-requests python -m unittest discover -s labs/19-hedged-requests/tests -v

      - name: Validate interactive lab bench JavaScript
        run: node --check site/app.js

      - name: Validate public workbench structure
        run: node site/validate-site.js

      - name: Validate compact desktop workbench budget
        run: node site/validate-workbench.js

      - name: Validate static hosting inputs
        run: test -s site/index.html && test -s site/styles.css && test -s amplify.yml
