name: Field Labs Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate Labs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run transaction reliability tests
        run: python -m unittest discover -s labs/01-transaction-reliability/tests -v

      - name: Run AI workflow boundary tests
        run: python -m unittest discover -s labs/02-ai-workflow-boundaries/tests -v

      - name: Run email delivery evidence tests
        run: PYTHONPATH=labs/03-email-delivery-verification python -m unittest discover -s labs/03-email-delivery-verification/tests -v

      - name: Run web session reliability tests
        run: PYTHONPATH=labs/04-web-session-reliability python -m unittest discover -s labs/04-web-session-reliability/tests -v

      - name: Run document annotation tests
        run: PYTHONPATH=labs/05-document-annotation python -m unittest discover -s labs/05-document-annotation/tests -v

      - name: Run verified document pipeline tests
        run: PYTHONPATH=labs/06-verified-document-pipeline python -m unittest discover -s labs/06-verified-document-pipeline/tests -v

      - name: Run offline event check-in tests
        run: PYTHONPATH=labs/07-offline-event-check-in python -m unittest discover -s labs/07-offline-event-check-in/tests -v

      - name: Validate interactive lab bench JavaScript
        run: node --check site/app.js

      - name: Validate public workbench structure
        run: node site/validate-site.js

      - name: Validate compact desktop workbench budget
        run: node site/validate-workbench.js

      - name: Validate static hosting inputs
        run: test -s site/index.html && test -s site/styles.css && test -s amplify.yml
