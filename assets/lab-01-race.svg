<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">Lab 01 transaction race</title><desc id="desc">Two synthetic workers race through a duplicate check toward one state mutation, illustrating the idempotency problem.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1628"/><stop offset="1" stop-color="#15102d"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs><rect width="1200" height="310" rx="24" fill="url(#bg)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="60" y="50" fill="#f8fafc" font-size="19" font-weight="700">LAB 01 / THE DUPLICATE TRANSACTION</text><text x="60" y="76" fill="#94a3b8" font-size="12">INVARIANT // ONE LOGICAL REQUEST → AT MOST ONE STATE CHANGE</text><g fill="#0f172a" stroke-width="2"><rect x="70" y="115" width="155" height="54" rx="14" stroke="#22d3ee"/><rect x="70" y="210" width="155" height="54" rx="14" stroke="#fb7185"/><rect x="385" y="115" width="235" height="54" rx="14" stroke="#8b5cf6"/><rect x="385" y="210" width="235" height="54" rx="14" stroke="#fbbf24"/><rect x="835" y="161" width="285" height="62" rx="16" stroke="#86efac"/></g><g fill="#e2e8f0" font-size="14" text-anchor="middle"><text x="147" y="148">WORKER A</text><text x="147" y="243">WORKER B</text><text x="502" y="148">DUPLICATE CHECK</text><text x="502" y="243">DUPLICATE CHECK</text><text x="977" y="198">STATE MUTATION</text></g><path d="M225 142H385" stroke="url(#a)" stroke-width="4"/><path d="M225 237H385" stroke="url(#b)" stroke-width="4"/><path d="M620 142C730 142 735 177 835 188" stroke="url(#a)" stroke-width="4" fill="none"/><path d="M620 237C730 237 735 210 835 197" stroke="url(#b)" stroke-width="4" fill="none"/><circle cx="735" cy="178" r="28" fill="#8b5cf6" opacity=".12"/><circle cx="735" cy="178" r="7" fill="#f8fafc"/><text x="735" y="132" fill="#c4b5fd" font-size="11" text-anchor="middle">RACE WINDOW</text><text x="977" y="260" fill="#86efac" font-size="11" text-anchor="middle">EXPECTED // ONCE</text><text x="977" y="280" fill="#fb7185" font-size="11" text-anchor="middle">FAILURE // TWICE</text></g></svg>