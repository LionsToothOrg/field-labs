<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc"><title id="title">The Field Labs method</title><desc id="desc">A six-stage experimental path from rebuild through documentation.</desc><defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17233b"/><stop offset="1" stop-color="#0a1221"/></linearGradient></defs><rect width="1200" height="270" rx="24" fill="#08111f"/><path d="M90 135H1110" stroke="url(#line)" stroke-width="4"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle"><g fill="url(#panel)" stroke-width="2"><rect x="55" y="92" width="150" height="86" rx="18" stroke="#22d3ee"/><rect x="243" y="92" width="150" height="86" rx="18" stroke="#38bdf8"/><rect x="431" y="92" width="150" height="86" rx="18" stroke="#8b5cf6"/><rect x="619" y="92" width="150" height="86" rx="18" stroke="#c084fc"/><rect x="807" y="92" width="150" height="86" rx="18" stroke="#86efac"/><rect x="995" y="92" width="150" height="86" rx="18" stroke="#fbbf24"/></g><g fill="#f8fafc" font-size="16" font-weight="700"><text x="130" y="131">REBUILD</text><text x="318" y="131">BREAK</text><text x="506" y="131">TRACE</text><text x="694" y="131">FIX</text><text x="882" y="131">PROVE</text><text x="1070" y="131">DOCUMENT</text></g><g fill="#94a3b8" font-size="11"><text x="130" y="153">make it real</text><text x="318" y="153">find the edge</text><text x="506" y="153">follow evidence</text><text x="694" y="153">smallest change</text><text x="882" y="153">validate claim</text><text x="1070" y="153">show receipts</text></g><text x="600" y="45" fill="#7dd3fc" font-size="13" letter-spacing="4">THE METHOD / QUESTION → EVIDENCE</text><text x="600" y="230" fill="#64748b" font-size="12" letter-spacing="2">NO MYSTERY BENCHMARKS · NO INVENTED RESULTS · LIMITATIONS INCLUDED</text></g><g fill="#08111f" stroke="#f8fafc" stroke-width="2"><circle cx="224" cy="135" r="6"/><circle cx="412" cy="135" r="6"/><circle cx="600" cy="135" r="6"/><circle cx="788" cy="135" r="6"/><circle cx="976" cy="135" r="6"/></g></svg>